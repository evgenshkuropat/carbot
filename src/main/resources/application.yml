spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    admin-chat-ids: ${TELEGRAM_ADMIN_CHAT_IDS:}

api:
  admin-token: ${API_ADMIN_TOKEN:}

support:
  paypal-url: ${SUPPORT_PAYPAL_URL:https://www.paypal.me/YEVHENSHKUROPAT}
  privatbank-url: ${SUPPORT_PRIVATBANK_URL:https://www.privat24.ua/send/47m35}
